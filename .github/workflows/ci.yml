name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    name: validate (lint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set executable permissions
        run: chmod +x scripts/*.sh app/*.sh tests/*.sh

      - name: Run lint
        run: ./scripts/lint.sh

  test:
    name: test (app test suite)
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set executable permissions
        run: chmod +x scripts/*.sh app/*.sh tests/*.sh

      - name: Run tests
        run: ./tests/test.sh

  docker:
    name: docker (build & smoke test)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set executable permissions
        run: chmod +x scripts/*.sh app/*.sh tests/*.sh

      - name: Build image and run smoke tests
        run: ./scripts/build.sh
